<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA ONLINE BOOST — Калькулятор заказа</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn .35s ease-out forwards',
            'slide-up': 'slideUp .45s cubic-bezier(.2,.8,.2,1) forwards',
            'pop': 'pop .35s cubic-bezier(.2,.8,.2,1) forwards',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(18px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            pop: { '0%': { transform: 'scale(.98)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
          }
        }
      }
    };
  </script>

  <!-- ✅ Стабильные CDN (jsDelivr) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <style>
    body{
      background:
        radial-gradient(1000px 600px at 10% 10%, rgba(46,204,113,.18), transparent 60%),
        radial-gradient(900px 520px at 90% 15%, rgba(45,116,218,.18), transparent 60%),
        radial-gradient(900px 700px at 55% 90%, rgba(139,92,246,.16), transparent 60%),
        linear-gradient(180deg, #05070f, #0b1223 60%, #05070f);
      color:#f8fafc;
      overflow-x:hidden;
    }
    .glass{
      background: rgba(17, 28, 51, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(14px);
    }
    .glass-strong{
      background: rgba(10, 15, 28, 0.88);
      border-top: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(16px);
    }
    .ring-soft{
      box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset;
    }

    /* Theme tokens */
    .theme-pc .accent-text { color: #2ecc71; }
    .theme-pc .accent-bg { background-color: #2ecc71; }
    .theme-pc .accent-border { border-color: rgba(46,204,113,.55); }
    .theme-pc .accent-glow { box-shadow: 0 0 24px rgba(46,204,113,.25); }

    .theme-ps .accent-text { color: #2d74da; }
    .theme-ps .accent-bg { background-color: #00439C; }
    .theme-ps .accent-border { border-color: rgba(45,116,218,.55); }
    .theme-ps .accent-glow { box-shadow: 0 0 24px rgba(45,116,218,.25); }

    .custom-checkbox:checked + .cbbox svg { display:block; }
  </style>
</head>

<body>
  <!-- Fallback (если React не запустился, будет видно “Загрузка…”) -->
  <div id="root" style="padding:24px;max-width:1100px;margin:0 auto;">
    <div class="glass ring-soft" style="border-radius:18px;padding:18px;">
      <b>Загрузка интерфейса…</b><br/>
      Если зависло — откройте консоль (F12) и проверьте ошибки загрузки.
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    /* ================== CONFIG ================== */
    const SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzWwZYbz9PM-X3uO4gEwMiyJaIvUYu_L5GIhAjLuTens6lHA__dxGRdsIPLMXfSFyUu/exec";

    /* ================== DATA ================== */
    const PLATFORMS = [
      { id: "Steam", label: "Steam", icon: "gamepad-2", type: "pc" },
      { id: "Epic", label: "Epic Games", icon: "zap", type: "pc" },
      { id: "Rockstar", label: "Rockstar Launcher", icon: "star", type: "pc" },
      { id: "PS", label: "PlayStation 4/5", icon: "gamepad", type: "ps" },
    ];

    const PC_MONEY_PACKS = [
      { val: 15, label: "15 млн", price: 115 },
      { val: 20, label: "20 млн", price: 140 },
      { val: 30, label: "30 млн", price: 230 },
      { val: 40, label: "40 млн", price: 325 },
      { val: 50, label: "50 млн", price: 420 },
      { val: 60, label: "60 млн", price: 210 },
      { val: 70, label: "70 млн", price: 605 },
      { val: 80, label: "80 млн", price: 700 },
      { val: 90, label: "90 млн", price: 790 },
      { val: 100, label: "100 млн", price: 885 },
      { val: 125, label: "125 млн", price: 1025 },
      { val: 150, label: "150 млн", price: 1120 },
      { val: 200, label: "200 млн", price: 1210 },
      { val: 350, label: "350 млн", price: 1400 },
      { val: 500, label: "500 млн", price: 1535 },
      { val: 750, label: "750 млн", price: 1720 },
      { val: 1000, label: "1 млрд", price: 1815 },
      { val: 1500, label: "1.5 млрд", price: 2050 },
      { val: 2000, label: "2 млрд", price: 2280 },
      { val: 4000, label: "4 млрд", price: 2750 },
    ];

    const PC_LEVELS_MAIN = [
      { id: "lvl_50", label: "50 LVL", price: 25 },
      { id: "lvl_100", label: "100 LVL", price: 50 },
      { id: "lvl_120", label: "120 LVL", price: 75 },
      { id: "lvl_777", label: "777 LVL", price: 100 },
      { id: "lvl_8000", label: "8000 LVL", price: 150 },
    ];

    const PC_LEVELS_EXTRA = [
      { id: "rep_car", label: "Автоклуб 1000 LVL", price: 100 },
      { id: "rep_arena", label: "Арена 1000 LVL", price: 100 },
      { id: "rep_crew", label: "Банда 1000 LVL", price: 100 },
    ];

    const PC_UNLOCKS = [
      { id: "unl_all_30", label: "Открыть всё (Выгода 30%)", price: 250, highlight: true },
      { id: "unl_skills", label: "Навыки персонажа", price: 50 },
      { id: "unl_run", label: "Быстрый бег и перезарядка", price: 50 },
      { id: "unl_lsc", label: "Тюнинг (LSC)", price: 50 },
      { id: "unl_gun", label: "Оружие", price: 50 },
      { id: "unl_tattoo", label: "Татуировки", price: 50 },
      { id: "unl_cloth", label: "Одежда", price: 50 },
      { id: "unl_hair", label: "Прически", price: 50 },
    ];

    const PC_VEHICLES = [
      { id: "veh_kosatka", label: "Kosatka (Подлодка)", price: 100 },
      { id: "veh_shotaro", label: "Shotaro (Мотоцикл)", price: 100 },
      { id: "veh_blista", label: "Go Go Monkey Blista", price: 100 },
      { id: "veh_removed", label: "Удаленное авто (название в чат)", price: 100 },
    ];

    const PC_SPECIAL = [
      { id: "spec_all_50", label: "Открыть всё (Выгода 50%)", price: 1450, highlight: true, icon: "crown" },
      { id: "spec_achiev", label: "Все достижения", price: 150 },
      { id: "spec_bunker_res", label: "Разработки бункера", price: 150 },
      { id: "spec_bunker_rng", label: "Награды тира бункера", price: 150 },
      { id: "spec_gender", label: "Изменить пол персонажа", price: 150 },
      { id: "spec_career", label: "Пройти карьеру", price: 150 },
      { id: "spec_skip_tut", label: "Пропуск обучения", price: 150 },
      { id: "spec_skip_cut", label: "Пропуск катсцен", price: 150 },
      { id: "spec_clear_rep", label: "Очистить репорты", price: 150 },
      { id: "spec_clear_psy", label: "Очистить психику", price: 150 },
      { id: "spec_nightclub", label: "Популярность клуба", price: 150 },
      { id: "spec_susp", label: "Сбросить подозрительность", price: 150 },
      { id: "spec_dunce", label: "Снять колпак «Dunce»", price: 150 },
    ];

    const PC_EXTRAS = [
      { id: "ex_priority", label: "⏰ Приоритетный заказ", price: 200 },
      { id: "ex_consult", label: "🧐 Консультация", price: 100 },
      { id: "ex_tip", label: "😎 Чаевые накрутчику", price: 100 },
    ];

    const PS_MONEY_CARS = [
      { id: 'ps_m_none', label: "Возьму наличкой / Не нужно", price: 0 },
      { id: 'ps_m_15', label: "15 млн (Машинами)", price: 765 },
      { id: 'ps_m_20', label: "20 млн (Машинами)", price: 935 },
      { id: 'ps_m_25', label: "25 млн (Машинами)", price: 1020 },
      { id: 'ps_m_30', label: "30 млн (Машинами)", price: 1105 },
      { id: 'ps_m_40', label: "40 млн (Машинами)", price: 1190 },
      { id: 'ps_m_50', label: "50 млн (Машинами)", price: 1360 },
      { id: 'ps_m_75', label: "75 млн (Машинами)", price: 1700 },
      { id: 'ps_m_100', label: "100 млн (Машинами)", price: 2040 },
      { id: 'ps_m_150', label: "150 млн (Машинами)", price: 2380 },
      { id: 'ps_m_200', label: "200 млн (Машинами)", price: 3060 },
      { id: 'ps_m_300', label: "300 млн (Машинами)", price: 4080 },
      { id: 'ps_m_400', label: "400 млн (Машинами)", price: 4590 },
      { id: 'ps_m_500', label: "500 млн (Машинами)", price: 5100 },
      { id: 'ps_m_750', label: "750 млн (Машинами)", price: 6800 },
    ];

    const PS_MONEY_CASH = [
      { id: 'ps_c_none', label: "Не нужна наличка", price: 0 },
      { id: 'ps_c_30', label: "30 млн (Наличкой)", price: 1190 },
      { id: 'ps_c_40', label: "40 млн (Наличкой)", price: 1360 },
    ];

    const PS_LEVELS = [
      { id: 'ps_l_none', label: "Уровень не нужен", price: 0 },
      { id: 'ps_l_100', label: "LVL 100", price: 2500 },
      { id: 'ps_l_120', label: "LVL 120", price: 3000 },
      { id: 'ps_l_135', label: "LVL 135", price: 3500 },
      { id: 'ps_l_150', label: "LVL 150", price: 4500 },
    ];

    const REQUISITES = [
      { label: "СБП (Любой банк)", num: "+7-914-172-85-17", icon: "smartphone" },
      { label: "Банковская карта Сбер", num: "2202 2032 9079 4421", icon: "credit-card" },
      { label: "Банковская карта Тбанк", num: "2200 7001 1816 8359", icon: "credit-card" },
    ];

    /* ================== UI ================== */
    const Icon = ({ name, className = "w-5 h-5" }) => {
      React.useEffect(() => {
        if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    const PriceTag = ({ price }) => (
      <span className={`font-display font-bold ${price > 0 ? 'accent-text' : 'text-white/40'}`}>
        {price > 0 ? `+${price}₽` : '0₽'}
      </span>
    );

    const Chip = ({ children }) => (
      <span className="inline-flex items-center gap-2 px-3 py-1 rounded-2xl bg-white/5 border border-white/10 text-white/70 text-xs">
        {children}
      </span>
    );

    function makeOrderId() {
      const rand = Math.random().toString(16).slice(2, 10).toUpperCase();
      const t = Date.now().toString(16).slice(-6).toUpperCase();
      return `ORD-${t}-${rand}`;
    }

    async function postOrder(payload) {
      const r = await fetch(SHEETS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      // Apps Script иногда отвечает text/plain — парсим безопасно
      const text = await r.text();
      try { return JSON.parse(text); }
      catch { return { ok:false, error:"bad_response", raw:text }; }
    }

    /* ================== APP ================== */
    function App() {
      const [platform, setPlatform] = React.useState(PLATFORMS[0].id);
      const isPlayStation = platform === "PS";
      const tone = isPlayStation ? "ps" : "pc";

      const accentBg = tone === "ps" ? "accent-bg" : "accent-bg";
      const accentText = "accent-text";

      // PC
      const [moneyIdx, setMoneyIdx] = React.useState(0);
      const [useMoney, setUseMoney] = React.useState(true);
      const [levelId, setLevelId] = React.useState(null);
      const [selectedExtras, setSelectedExtras] = React.useState(new Set());

      // PS
      const [psConsole, setPsConsole] = React.useState("PS4");
      const [psCarMoney, setPsCarMoney] = React.useState(PS_MONEY_CARS[0]);
      const [psCashMoney, setPsCashMoney] = React.useState(PS_MONEY_CASH[0]);
      const [psLevel, setPsLevel] = React.useState(PS_LEVELS[0]);
      const [psReq200k, setPsReq200k] = React.useState(false);
      const [psReqPlus, setPsReqPlus] = React.useState(false);

      // Modal / Form
      const [login, setLogin] = React.useState("");
      const [password, setPassword] = React.useState("");
      const [contacts, setContacts] = React.useState("");
      const [comment, setComment] = React.useState("");

      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [isSubmitting, setIsSubmitting] = React.useState(false);
      const [successId, setSuccessId] = React.useState(null);
      const [errorMsg, setErrorMsg] = React.useState("");

      const toggleExtra = (id) => {
        const next = new Set(selectedExtras);
        next.has(id) ? next.delete(id) : next.add(id);
        setSelectedExtras(next);
      };

      const calculateTotal = () => {
        let total = 0;
        if (isPlayStation) {
          total += psCarMoney.price;
          total += psCashMoney.price;
          total += psLevel.price;
          if (psReq200k) total += 500;
          if (psReqPlus) total += 500;
        } else {
          if (useMoney && PC_MONEY_PACKS[moneyIdx]) total += PC_MONEY_PACKS[moneyIdx].price;
          if (levelId) {
            const lvl = PC_LEVELS_MAIN.find(x => x.id === levelId);
            if (lvl) total += lvl.price;
          }
          const all = [...PC_LEVELS_EXTRA, ...PC_UNLOCKS, ...PC_VEHICLES, ...PC_SPECIAL, ...PC_EXTRAS];
          selectedExtras.forEach(id => {
            const item = all.find(x => x.id === id);
            if (item) total += item.price;
          });
        }
        return total;
      };

      const totalPrice = calculateTotal();

      const buildItems = () => {
        let items = [];
        if (isPlayStation) {
          items.push({ type:"PS", label:`Консоль: ${psConsole}`, price:0 });
          if (psCarMoney.id !== 'ps_m_none') items.push({ type:"MoneyCars", label: psCarMoney.label, price: psCarMoney.price });
          if (psCashMoney.id !== 'ps_c_none') items.push({ type:"MoneyCash", label: psCashMoney.label, price: psCashMoney.price });
          if (psLevel.id !== 'ps_l_none') items.push({ type:"Level", label: psLevel.label, price: psLevel.price });
          if (psReq200k) items.push({ type:"Req", label:"Нет 200к на счету", price: 500 });
          if (psReqPlus) items.push({ type:"Req", label:"Нет подписки PS+", price: 500 });
        } else {
          items.push({ type:"Platform", label:`Платформа: ${PLATFORMS.find(p=>p.id===platform).label}`, price:0 });
          items.push({ type:"Money", label: useMoney ? `Валюта: ${PC_MONEY_PACKS[moneyIdx].label}` : "Валюта: Не нужна", price: useMoney ? PC_MONEY_PACKS[moneyIdx].price : 0 });
          if (levelId) {
            const lvl = PC_LEVELS_MAIN.find(x => x.id === levelId);
            items.push({ type:"Level", label:`Уровень: ${lvl.label}`, price:lvl.price });
          }
          const all = [...PC_LEVELS_EXTRA, ...PC_UNLOCKS, ...PC_VEHICLES, ...PC_SPECIAL, ...PC_EXTRAS];
          all.filter(x => selectedExtras.has(x.id)).forEach(x => items.push({ type:"Extra", label:x.label, price:x.price }));
        }
        return items;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg("");
        setIsSubmitting(true);

        try {
          const orderId = makeOrderId();

          const payload = {
            orderId,
            platform: isPlayStation ? `PlayStation (${psConsole})` : PLATFORMS.find(p=>p.id===platform).label,
            total: totalPrice,
            login: login.trim(),
            password: password.trim(),
            contacts: contacts.trim(),
            comment: comment.trim(),
            paidConfirmed: true, // по твоей логике: кнопка "Я оплатил"
            items: buildItems()
          };

          const res = await postOrder(payload);
          if (!res || !res.ok) {
            setErrorMsg("Не удалось отправить заказ. Проверь Apps Script Deploy и доступ (Anyone).");
            console.error("Sheets response:", res);
            return;
          }

          setSuccessId(orderId);
          setIsModalOpen(false);
          if (window.confetti) {
            window.confetti({ particleCount: 180, spread: 80, origin: { y: 0.7 } });
          }
        } catch (err) {
          console.error(err);
          setErrorMsg("Ошибка соединения. Попробуйте позже.");
        } finally {
          setIsSubmitting(false);
        }
      };

      // ✅ SUCCESS SCREEN (без JSX-ошибок)
      if (successId) {
        return (
          <div className={`min-h-screen flex items-center justify-center p-4 ${tone === "ps" ? "theme-ps" : "theme-pc"}`}>
            <div className="glass max-w-md w-full p-8 rounded-3xl border border-white/10 animate-pop">
              <div className={`w-16 h-16 rounded-2xl accent-bg flex items-center justify-center text-white mb-6`}>
                <Icon name="check-circle" className="w-8 h-8" />
              </div>

              <h1 className="text-3xl font-display font-extrabold text-white">Заказ отправлен</h1>
              <p className="text-white/70 mt-2">
                Номер заказа: <span className={`${accentText} font-bold`}>{successId}</span>
              </p>

              <div className="mt-4 rounded-2xl bg-white/5 border border-white/10 p-4">
                <div className="text-xs text-white/50 uppercase tracking-widest mb-2">Статус заказа</div>
                <a
                  className="block w-full text-center py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 text-white font-semibold"
                  href={`./status.html?orderId=${encodeURIComponent(successId)}`}
                >
                  Открыть страницу статуса
                </a>

                <button
                  className="mt-2 w-full py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 text-white font-semibold"
                  onClick={async () => {
                    try {
                      const u = `${SHEETS_WEBAPP_URL}?action=status&orderId=${encodeURIComponent(successId)}`;
                      const r = await fetch(u);
                      const txt = await r.text();
                      const j = JSON.parse(txt);
                      alert(j.ok ? `Статус: ${j.status}` : `Ошибка: ${j.error}`);
                    } catch (e) {
                      alert("Не удалось проверить статус");
                    }
                  }}
                >
                  Проверить статус (быстро)
                </button>
              </div>

              <button
                onClick={() => window.location.reload()}
                className="mt-4 w-full py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 text-white font-semibold"
              >
                Новый заказ
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className={`pb-28 ${tone === "ps" ? "theme-ps" : "theme-pc"}`}>
          {/* HEADER */}
          <header className="py-10 text-center px-4">
            <div className="inline-flex items-center gap-2 mb-3">
              <Chip><Icon name="shield" className="w-4 h-4" /> Без Trello/Telegram</Chip>
              <Chip><Icon name="table" className="w-4 h-4" /> Заказ → Google Sheets</Chip>
            </div>

            <h1 className="text-5xl md:text-6xl font-display font-black text-white mb-2 tracking-tight">
              GTA ONLINE <span className="accent-text">BOOST</span>
            </h1>
            <p className="text-white/60">Собери свой пак. Моментальный расчет цены.</p>
          </header>

          <main className="max-w-5xl mx-auto px-4 grid gap-8">
            {/* 1. PLATFORM */}
            <section className="glass p-6 rounded-3xl animate-slide-up">
              <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                <Icon name="monitor" className="accent-text" /> 1. Платформа
              </h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {PLATFORMS.map(p => (
                  <label key={p.id} className="cursor-pointer">
                    <input
                      type="radio"
                      name="plat"
                      className="sr-only"
                      checked={platform === p.id}
                      onChange={() => setPlatform(p.id)}
                    />
                    <div className={`ring-soft border p-4 rounded-2xl flex flex-col items-center gap-2 transition
                      ${platform === p.id ? 'accent-border bg-white/10 text-white accent-glow' : 'border-white/10 bg-white/5 text-white/70 hover:bg-white/10'}
                    `}>
                      <Icon name={p.icon} className="w-6 h-6" />
                      <span className="text-sm font-bold text-center">{p.label}</span>
                    </div>
                  </label>
                ))}
              </div>
            </section>

            {/* CONDITIONAL CONTENT */}
            {isPlayStation ? (
              <>
                {/* PS VERSION */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.06s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="gamepad-2" className="accent-text" /> 2. Версия консоли
                  </h2>
                  <div className="flex gap-3">
                    {["PS4","PS5"].map(ver => (
                      <label key={ver} className="cursor-pointer flex-1">
                        <input type="radio" name="psver" className="sr-only" checked={psConsole===ver} onChange={() => setPsConsole(ver)} />
                        <div className={`ring-soft border p-4 rounded-2xl text-center font-bold transition
                          ${psConsole===ver ? 'accent-border bg-white/10 text-white' : 'border-white/10 bg-white/5 text-white/70 hover:bg-white/10'}
                        `}>
                          {ver}
                        </div>
                      </label>
                    ))}
                  </div>
                </section>

                {/* PS MONEY CARS */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.12s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-2 flex items-center gap-2">
                    <Icon name="car" className="accent-text" /> 3. Деньги машинами (Deluxo)
                  </h2>
                  <p className="text-sm text-white/60 mb-4">Самый безопасный способ. Мы забиваем гаражи дорогими авто, вы их продаете.</p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                    {PS_MONEY_CARS.map(m => (
                      <button
                        key={m.id}
                        onClick={() => setPsCarMoney(m)}
                        className={`p-3 rounded-2xl border ring-soft text-left flex justify-between items-center transition
                          ${psCarMoney.id===m.id ? 'accent-bg text-white border-transparent' : 'border-white/10 bg-white/5 text-white/80 hover:bg-white/10'}
                        `}
                      >
                        <span className="font-bold text-sm">{m.label}</span>
                        <span className="text-xs opacity-80">{m.price===0 ? "0₽" : `+${m.price}₽`}</span>
                      </button>
                    ))}
                  </div>
                </section>

                {/* PS CASH & LEVEL */}
                <div className="grid md:grid-cols-2 gap-8 animate-slide-up" style={{animationDelay:'0.18s'}}>
                  <section className="glass p-6 rounded-3xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="banknote" className="accent-text" /> 4. Наличка
                    </h2>
                    <div className="space-y-2">
                      {PS_MONEY_CASH.map(m => (
                        <button
                          key={m.id}
                          onClick={() => setPsCashMoney(m)}
                          className={`w-full p-3 rounded-2xl border ring-soft text-left flex justify-between items-center transition
                            ${psCashMoney.id===m.id ? 'accent-bg text-white border-transparent' : 'border-white/10 bg-white/5 text-white/80 hover:bg-white/10'}
                          `}
                        >
                          <span className="font-bold text-sm">{m.label}</span>
                          <span className="text-xs opacity-80">{m.price===0 ? "0₽" : `+${m.price}₽`}</span>
                        </button>
                      ))}
                    </div>
                  </section>

                  <section className="glass p-6 rounded-3xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="star" className="accent-text" /> 5. Уровень
                    </h2>
                    <div className="space-y-2">
                      {PS_LEVELS.map(l => (
                        <button
                          key={l.id}
                          onClick={() => setPsLevel(l)}
                          className={`w-full p-3 rounded-2xl border ring-soft text-left flex justify-between items-center transition
                            ${psLevel.id===l.id ? 'accent-bg text-white border-transparent' : 'border-white/10 bg-white/5 text-white/80 hover:bg-white/10'}
                          `}
                        >
                          <span className="font-bold text-sm">{l.label}</span>
                          <span className="text-xs opacity-80">{l.price===0 ? "0₽" : `+${l.price}₽`}</span>
                        </button>
                      ))}
                    </div>
                  </section>
                </div>

                {/* PS REQUIREMENTS */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.24s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="alert-triangle" className="text-yellow-400" /> Требования для прокачки
                  </h2>

                  <div className="grid md:grid-cols-2 gap-3">
                    <label className="flex items-center gap-3 p-4 rounded-2xl border border-white/10 bg-white/5 cursor-pointer hover:bg-white/10 transition">
                      <input type="checkbox" className="custom-checkbox sr-only" checked={psReq200k} onChange={e=>setPsReq200k(e.target.checked)} />
                      <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                        <Icon name="check" className="w-4 h-4 text-white hidden" />
                      </div>
                      <div className="flex-1 flex justify-between items-center text-sm text-white/85">
                        <span>У меня нет 200.000$ на балансе</span>
                        <PriceTag price={500} />
                      </div>
                    </label>

                    <label className="flex items-center gap-3 p-4 rounded-2xl border border-white/10 bg-white/5 cursor-pointer hover:bg-white/10 transition">
                      <input type="checkbox" className="custom-checkbox sr-only" checked={psReqPlus} onChange={e=>setPsReqPlus(e.target.checked)} />
                      <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                        <Icon name="check" className="w-4 h-4 text-white hidden" />
                      </div>
                      <div className="flex-1 flex justify-between items-center text-sm text-white/85">
                        <span>У меня нет подписки PS+</span>
                        <PriceTag price={500} />
                      </div>
                    </label>
                  </div>
                </section>
              </>
            ) : (
              <>
                {/* 2. MONEY */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.06s'}}>
                  <div className="flex justify-between items-center mb-4 gap-4 flex-wrap">
                    <h2 className="text-xl font-display font-bold text-white flex items-center gap-2">
                      <Icon name="banknote" className="accent-text" /> 2. Валюта
                    </h2>
                    <label className="flex items-center gap-2 text-sm text-white/60 cursor-pointer select-none">
                      <input type="checkbox" checked={!useMoney} onChange={e => setUseMoney(!e.target.checked)} />
                      Мне не нужна валюта
                    </label>
                  </div>

                  <div className={`transition-all duration-300 ${!useMoney ? 'opacity-30 pointer-events-none grayscale' : ''}`}>
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                      {PC_MONEY_PACKS.map((pk, idx) => (
                        <button
                          key={idx}
                          onClick={() => setMoneyIdx(idx)}
                          className={`p-2 rounded-2xl border ring-soft text-sm flex flex-col items-center justify-center gap-1 transition
                            ${moneyIdx===idx ? 'accent-bg text-black border-transparent scale-[1.03]' : 'border-white/10 bg-white/5 text-white/80 hover:bg-white/10'}
                          `}
                        >
                          <span className="font-bold">{pk.label}</span>
                          <span className="text-[10px] opacity-80">{pk.price === 0 ? "Бесплатно" : `+${pk.price}₽`}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </section>

                {/* 3. LEVELS */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.12s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="star" className="accent-text" /> 3. Уровень и Репутация
                  </h2>

                  <div className="mb-4">
                    <p className="text-sm text-white/60 mb-2">Уровень персонажа (Один на выбор):</p>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => setLevelId(null)}
                        className={`px-4 py-2 rounded-2xl border ring-soft text-sm font-bold
                          ${levelId===null ? 'bg-white/15 border-white/20 text-white' : 'border-white/10 bg-white/5 text-white/70 hover:bg-white/10'}
                        `}
                      >
                        Не менять
                      </button>

                      {PC_LEVELS_MAIN.map(l => (
                        <button
                          key={l.id}
                          onClick={() => setLevelId(l.id)}
                          className={`px-4 py-2 rounded-2xl border ring-soft text-sm font-bold transition
                            ${levelId===l.id ? 'accent-bg text-black border-transparent' : 'border-white/10 bg-white/5 text-white/80 hover:bg-white/10'}
                          `}
                        >
                          {l.label} <span className="opacity-70 font-normal">+{l.price}₽</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid sm:grid-cols-3 gap-3">
                    {PC_LEVELS_EXTRA.map(item => (
                      <label key={item.id} className="flex items-center gap-3 p-3 rounded-2xl border border-white/10 bg-white/5 cursor-pointer hover:bg-white/10 transition">
                        <input type="checkbox" className="custom-checkbox sr-only" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                        <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                          <Icon name="check" className="w-4 h-4 text-white hidden" />
                        </div>
                        <div className="flex-1 flex justify-between items-center text-sm">
                          <span className="text-white/85">{item.label}</span>
                          <PriceTag price={item.price} />
                        </div>
                      </label>
                    ))}
                  </div>
                </section>

                {/* 4. UNLOCKS & VEHICLES */}
                <div className="grid md:grid-cols-2 gap-8 animate-slide-up" style={{animationDelay:'0.18s'}}>
                  <section className="glass p-6 rounded-3xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="unlock" className="accent-text" /> 🔰 Разблокировки
                    </h2>
                    <div className="space-y-2">
                      {PC_UNLOCKS.map(item => (
                        <label key={item.id} className={`flex items-center gap-3 p-3 rounded-2xl border cursor-pointer transition
                          ${item.highlight ? 'accent-border bg-white/10' : 'border-white/10 bg-white/5 hover:bg-white/10'}
                        `}>
                          <input type="checkbox" className="custom-checkbox sr-only" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                            <Icon name="check" className="w-4 h-4 text-white hidden" />
                          </div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                            <span className={item.highlight ? 'accent-text font-bold' : 'text-white/85'}>{item.label}</span>
                            <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>

                  <section className="glass p-6 rounded-3xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="car" className="accent-text" /> 🚘 Транспорт
                    </h2>
                    <div className="space-y-2">
                      {PC_VEHICLES.map(item => (
                        <label key={item.id} className="flex items-center gap-3 p-3 rounded-2xl border border-white/10 bg-white/5 cursor-pointer hover:bg-white/10 transition">
                          <input type="checkbox" className="custom-checkbox sr-only" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                            <Icon name="check" className="w-4 h-4 text-white hidden" />
                          </div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                            <span className="text-white/85">{item.label}</span>
                            <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>

                    <h2 className="text-xl font-display font-bold text-white mt-8 mb-4 flex items-center gap-2">
                      <Icon name="target" className="accent-text" /> 🎯 Дополнительно
                    </h2>
                    <div className="space-y-2">
                      {PC_EXTRAS.map(item => (
                        <label key={item.id} className="flex items-center gap-3 p-3 rounded-2xl border border-white/10 bg-white/5 cursor-pointer hover:bg-white/10 transition">
                          <input type="checkbox" className="custom-checkbox sr-only" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                            <Icon name="check" className="w-4 h-4 text-white hidden" />
                          </div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                            <span className="text-white/85">{item.label}</span>
                            <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>
                </div>

                {/* 5. SPECIAL */}
                <section className="glass p-6 rounded-3xl animate-slide-up" style={{animationDelay:'0.24s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="crown" className="text-yellow-300" /> 👑 Особые услуги
                  </h2>
                  <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {PC_SPECIAL.map(item => (
                      <label key={item.id} className={`flex items-center gap-3 p-3 rounded-2xl border cursor-pointer transition
                        ${item.highlight ? 'border-yellow-400/40 bg-yellow-400/10' : 'border-white/10 bg-white/5 hover:bg-white/10'}
                      `}>
                        <input type="checkbox" className="custom-checkbox sr-only" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                        <div className="cbbox w-5 h-5 rounded border border-white/30 flex items-center justify-center bg-black/20">
                          <Icon name="check" className="w-4 h-4 text-white hidden" />
                        </div>
                        <div className="flex-1 flex justify-between items-center text-sm">
                          <span className={item.highlight ? 'text-yellow-200 font-bold' : 'text-white/85'}>{item.label}</span>
                          <PriceTag price={item.price} />
                        </div>
                      </label>
                    ))}
                  </div>
                </section>
              </>
            )}
          </main>

          {/* STICKY FOOTER */}
          <div className="fixed bottom-0 left-0 w-full glass-strong p-4 z-40">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
              <div>
                <div className="text-xs text-white/50 uppercase tracking-wider">Итоговая цена</div>
                <div className="text-3xl font-display font-bold accent-text">{totalPrice} RUB</div>
              </div>
              <button
                onClick={() => setIsModalOpen(true)}
                className="accent-bg hover:brightness-110 text-white font-bold py-3 px-7 rounded-2xl text-lg shadow-[0_0_25px_rgba(255,255,255,0.08)] hover:scale-[1.03] transition"
              >
                Оформить заказ
              </button>
            </div>
          </div>

          {/* MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>

              <div className="relative glass w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                {/* Header */}
                <div className="p-6 border-b border-white/10 bg-black/20">
                  <h3 className="text-2xl font-display font-bold text-white">Оформление заказа</h3>
                  <button onClick={() => setIsModalOpen(false)} className="absolute top-6 right-6 text-white/60 hover:text-white">
                    <Icon name="x" className="w-6 h-6" />
                  </button>
                </div>

                {/* Scroll */}
                <div className="overflow-y-auto p-6 space-y-6">
                  {/* Cart */}
                  <div className="bg-white/5 p-4 rounded-2xl border border-white/10 text-sm">
                    <h4 className="font-bold text-white/60 mb-2 uppercase text-xs">Ваша корзина</h4>
                    <ul className="space-y-1 text-white/85">
                      {buildItems().filter(x => x.price > 0 || x.type==="Platform" || x.type==="PS").map((x, idx) => (
                        <li key={idx} className="flex justify-between gap-3">
                          <span className="truncate">{x.label}</span>
                          <span className="shrink-0">{x.price ? `${x.price}₽` : ""}</span>
                        </li>
                      ))}
                    </ul>
                    <div className="mt-3 pt-3 border-t border-white/10 flex justify-between font-bold text-lg text-white">
                      <span>Итого:</span>
                      <span className="accent-text">{totalPrice} RUB</span>
                    </div>
                  </div>

                  {/* Payment */}
                  <div>
                    <h4 className="font-bold text-white mb-3">Выберите способ оплаты</h4>
                    <div className="space-y-2">
                      {REQUISITES.map((req, i) => (
                        <div key={i} className="flex items-center justify-between gap-3 p-3 rounded-2xl border border-white/10 bg-white/5">
                          <div className="flex items-center gap-3 min-w-0">
                            <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center accent-text shrink-0">
                              <Icon name={req.icon} className="w-5 h-5" />
                            </div>
                            <div className="min-w-0">
                              <div className="font-bold truncate">{req.label}</div>
                              <div className="text-xs text-white/50">Комиссия 0%</div>
                            </div>
                          </div>

                          <button
                            onClick={() => navigator.clipboard.writeText(req.num.replace(/\s/g, ''))}
                            className="text-xs bg-white/10 hover:bg-white/15 px-3 py-2 rounded-2xl transition border border-white/10 shrink-0"
                            title="Скопировать"
                          >
                            {req.num} <Icon name="copy" className="w-3 h-3 inline ml-1" />
                          </button>
                        </div>
                      ))}
                    </div>
                    <p className="text-xs text-red-300 mt-3 text-center">
                      ⚠ Переведите <b>{totalPrice}₽</b> по реквизитам выше, затем заполните форму.
                    </p>
                  </div>

                  {/* Error */}
                  {errorMsg && (
                    <div className="rounded-2xl border border-red-400/30 bg-red-400/10 p-3 text-sm text-red-200">
                      {errorMsg}
                    </div>
                  )}

                  {/* Form */}
                  <form id="payForm" onSubmit={handleSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs text-white/60 uppercase font-bold mb-1">
                        Данные от аккаунта (для выполнения заказа)
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input
                          required
                          placeholder="Логин игры"
                          className="bg-black/20 border border-white/10 rounded-2xl p-3 text-white outline-none focus:border-white/30"
                          value={login}
                          onChange={e=>setLogin(e.target.value)}
                        />
                        <input
                          required
                          type="password"
                          placeholder="Пароль игры"
                          className="bg-black/20 border border-white/10 rounded-2xl p-3 text-white outline-none focus:border-white/30"
                          value={password}
                          onChange={e=>setPassword(e.target.value)}
                        />
                      </div>
                      <p className="text-xs text-white/45 mt-2">
                        Данные сохраняются только в таблице и нужны для выполнения заказа.
                      </p>
                    </div>

                    <div>
                      <label className="block text-xs text-white/60 uppercase font-bold mb-1">
                        Ваш TG или VK (куда писать о готовности?)
                      </label>
                      <input
                        required
                        placeholder="@username или ссылка на VK"
                        className="w-full bg-black/20 border border-white/10 rounded-2xl p-3 text-white outline-none focus:border-white/30"
                        value={contacts}
                        onChange={e=>setContacts(e.target.value)}
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-white/60 uppercase font-bold mb-1">
                        Комментарий (необязательно)
                      </label>
                      <textarea
                        placeholder="Например: нужно сегодня до вечера / не трогать настройки"
                        className="w-full bg-black/20 border border-white/10 rounded-2xl p-3 text-white outline-none focus:border-white/30 min-h-[90px]"
                        value={comment}
                        onChange={e=>setComment(e.target.value)}
                      />
                    </div>
                  </form>
                </div>

                {/* Footer */}
                <div className="p-6 border-t border-white/10 bg-black/20">
                  <button
                    form="payForm"
                    disabled={isSubmitting}
                    className="w-full accent-bg hover:brightness-110 text-white font-bold py-4 rounded-2xl text-lg shadow-lg transition flex items-center justify-center gap-2 disabled:opacity-60"
                  >
                    {isSubmitting ? <Icon name="loader" className="w-5 h-5 animate-spin" /> : "Я ОПЛАТИЛ, ОТПРАВИТЬ"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
