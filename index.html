            const item = allCheckboxes.find(i => i.id === id);
            if (item) total += item.price;

🧾 **НОВЫЙ ЗАКАЗ**

**Состав заказа:**
${itemsText.join('\n')}

            headers: { "Content-Type": "application/json" },

                      </h2>
                      <div className="space-y-2">
                         {PS_MONEY_CASH.map((m) => (
                           <button 
                             key={m.id}
                             onClick={() => setPsCashMoney(m)}
                             className={`w-full p-3 rounded-xl border text-left flex justify-between items-center transition ${psCashMoney.id === m.id ? 'accent-bg text-white border-transparent' : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                           >
                             <span className="font-bold text-sm">{m.label}</span>
                             <span className="text-xs opacity-80">{m.price === 0 ? "0₽" : `+${m.price}₽`}</span>
                           </button>
                         ))}
                      </div>
                    </section>

                    <section className="glass p-6 rounded-2xl">
                      <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                        <Icon name="star" className="accent-text" /> 5. Уровень
                      </h2>
                      <div className="space-y-2">
                         {PS_LEVELS.map((l) => (
                           <button 
                             key={l.id}
                             onClick={() => setPsLevel(l)}
                             className={`w-full p-3 rounded-xl border text-left flex justify-between items-center transition ${psLevel.id === l.id ? 'accent-bg text-white border-transparent' : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                           >
                             <span className="font-bold text-sm">{l.label}</span>
                             <span className="text-xs opacity-80">{l.price === 0 ? "0₽" : `+${l.price}₽`}</span>
                           </button>
                         ))}
                      </div>
                    </section>
                 </div>

                 {/* PS REQUIREMENTS */}
                 <section className="glass p-6 rounded-2xl animate-slide-up" style={{animationDelay: '0.4s'}}>
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="alert-triangle" className="text-yellow-500" /> Требования для прокачки
                    </h2>
                    <div className="grid md:grid-cols-2 gap-4">
                       <label className="flex items-center gap-3 p-4 rounded-xl border border-slate-700 bg-slate-800/30 cursor-pointer hover:bg-slate-800/60 transition">
                         <input type="checkbox" className="custom-checkbox sr-only" checked={psReq200k} onChange={(e) => setPsReq200k(e.target.checked)} />
                         <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                         <div className="flex-1 flex justify-between items-center text-sm">
                            <span>У меня нет 200.000$ на балансе</span>
                            <PriceTag price={500} />
                         </div>
                       </label>
                       
                       <label className="flex items-center gap-3 p-4 rounded-xl border border-slate-700 bg-slate-800/30 cursor-pointer hover:bg-slate-800/60 transition">
                         <input type="checkbox" className="custom-checkbox sr-only" checked={psReqPlus} onChange={(e) => setPsReqPlus(e.target.checked)} />
                         <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                         <div className="flex-1 flex justify-between items-center text-sm">
                            <span>У меня нет подписки PS+</span>
                            <PriceTag price={500} />
                         </div>
                       </label>
                    </div>
                 </section>
              </>
            ) : (
              // ============ PC CONTENT (OLD LOGIC) ============
              <>
                 {/* 2. MONEY */}
                <section className="glass p-6 rounded-2xl animate-slide-up" style={{animationDelay: '0.1s'}}>
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-display font-bold text-white flex items-center gap-2">
                      <Icon name="banknote" className="accent-text" /> 2. Валюта
                    </h2>
                    <label className="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
                      <input type="checkbox" className="accent-check" checked={!useMoney} onChange={(e) => setUseMoney(!e.target.checked)} />
                      Мне не нужна валюта
                    </label>
                  </div>

                  <div className={`transition-all duration-300 ${!useMoney ? 'opacity-30 pointer-events-none grayscale' : ''}`}>
                      <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                        {PC_MONEY_PACKS.map((pk, idx) => (
                          <button 
                            key={idx}
                            onClick={() => setMoneyIdx(idx)}
                            className={`p-2 rounded-lg border text-sm flex flex-col items-center justify-center gap-1 transition-all ${moneyIdx === idx ? 'accent-bg text-black border-transparent shadow-lg transform scale-105' : 'bg-slate-800/50 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                          >
                            <span className="font-bold">{pk.label}</span>
                            <span className="text-[10px] opacity-80">{pk.price === 0 ? "Бесплатно" : `+${pk.price}₽`}</span>
                          </button>
                        ))}
                      </div>
                  </div>
                </section>

                {/* 3. LEVELS */}
                <section className="glass p-6 rounded-2xl animate-slide-up" style={{animationDelay: '0.2s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="star" className="accent-text" /> 3. Уровень и Репутация
                  </h2>
                  
                  <div className="mb-4">
                      <p className="text-sm text-slate-400 mb-2">Уровень персонажа (Один на выбор):</p>
                      <div className="flex flex-wrap gap-2">
                        <button onClick={() => setLevelId(null)} className={`px-4 py-2 rounded-lg border text-sm font-bold ${levelId === null ? 'bg-slate-600 border-slate-500 text-white' : 'border-slate-700 bg-slate-800/30 text-slate-400'}`}>Не менять</button>
                        {PC_LEVELS_MAIN.map(l => (
                          <button 
                            key={l.id} 
                            onClick={() => setLevelId(l.id)}
                            className={`px-4 py-2 rounded-lg border text-sm font-bold transition ${levelId === l.id ? 'accent-bg text-black border-transparent' : 'border-slate-700 bg-slate-800/30 hover:border-slate-500'}`}
                          >
                            {l.label} <span className="opacity-70 font-normal">+{l.price}₽</span>
                          </button>
                        ))}
                      </div>
                  </div>

                  <div className="grid sm:grid-cols-3 gap-3">
                    {PC_LEVELS_EXTRA.map(item => (
                      <label key={item.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-700 bg-slate-800/30 cursor-pointer hover:bg-slate-800/60 transition group">
                        <input type="checkbox" className="custom-checkbox sr-only accent-check" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                        <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center group-hover:border-white transition">
                          <Icon name="check" className="w-3 h-3 text-black hidden" />
                        </div>
                        <div className="flex-1 flex justify-between items-center text-sm">
                           <span>{item.label}</span>
                           <PriceTag price={item.price} />
                        </div>
                      </label>
                    ))}
                  </div>
                </section>

                {/* 4. UNLOCKS & VEHICLES */}
                <div className="grid md:grid-cols-2 gap-8 animate-slide-up" style={{animationDelay: '0.3s'}}>
                  <section className="glass p-6 rounded-2xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="unlock" className="accent-text" /> 🔰 Разблокировки
                    </h2>
                    <div className="space-y-2">
                      {PC_UNLOCKS.map(item => (
                        <label key={item.id} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${item.highlight ? 'accent-border bg-white/5' : 'border-slate-700 bg-slate-800/30'}`}>
                          <input type="checkbox" className="custom-checkbox sr-only accent-check" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                              <span className={item.highlight ? 'accent-text font-bold' : 'text-slate-200'}>{item.label}</span>
                              <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>

                  <section className="glass p-6 rounded-2xl">
                    <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                      <Icon name="car" className="accent-text" /> 🚘 Транспорт
                    </h2>
                    <div className="space-y-2">
                      {PC_VEHICLES.map(item => (
                        <label key={item.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-700 bg-slate-800/30 cursor-pointer hover:bg-slate-800/60 transition">
                          <input type="checkbox" className="custom-checkbox sr-only accent-check" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                              <span>{item.label}</span>
                              <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>
                    
                    <h2 className="text-xl font-display font-bold text-white mt-8 mb-4 flex items-center gap-2">
                      <Icon name="target" className="accent-text" /> 🎯 Дополнительно
                    </h2>
                     <div className="space-y-2">
                      {PC_EXTRAS.map(item => (
                        <label key={item.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-700 bg-slate-800/30 cursor-pointer hover:bg-slate-800/60 transition">
                          <input type="checkbox" className="custom-checkbox sr-only accent-check" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                              <span>{item.label}</span>
                              <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>
                </div>

                {/* 5. SPECIAL UNLOCKS */}
                <section className="glass p-6 rounded-2xl animate-slide-up" style={{animationDelay: '0.4s'}}>
                  <h2 className="text-xl font-display font-bold text-white mb-4 flex items-center gap-2">
                    <Icon name="crown" className="text-yellow-400" /> 👑 Особые услуги
                  </h2>
                  <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                     {PC_SPECIAL.map(item => (
                        <label key={item.id} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${item.highlight ? 'border-yellow-500/50 bg-yellow-500/5' : 'border-slate-700 bg-slate-800/30'}`}>
                          <input type="checkbox" className="custom-checkbox sr-only accent-check" checked={selectedExtras.has(item.id)} onChange={() => toggleExtra(item.id)} />
                          <div className="w-5 h-5 rounded border border-slate-500 flex items-center justify-center bg-slate-900"><Icon name="check" className="w-3 h-3 text-black hidden" /></div>
                          <div className="flex-1 flex justify-between items-center text-sm">
                              <span className={item.highlight ? 'text-yellow-400 font-bold' : 'text-slate-200'}>{item.label}</span>
                              <PriceTag price={item.price} />
                          </div>
                        </label>
                      ))}
                  </div>
                </section>
              </>
            )}

          </main>

          {/* STICKY FOOTER */}
          <div className="fixed bottom-0 left-0 w-full glass-strong p-4 z-40">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
              <div>
                <div className="text-xs text-slate-400 uppercase tracking-wider">Итоговая цена</div>
                <div className="text-3xl font-display font-bold accent-text">{totalPrice} RUB</div>
              </div>
              <button 
                onClick={() => setIsModalOpen(true)}
                className="accent-bg hover:brightness-110 text-white font-bold py-3 px-8 rounded-xl text-lg shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:scale-105 transition-transform"
              >
                Оформить заказ
              </button>
            </div>
          </div>

          {/* PAYMENT MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>
              <div className="relative bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                
                {/* Header */}
                <div className="p-6 border-b border-slate-800 bg-slate-900 z-10">
                  <h3 className="text-2xl font-display font-bold text-white">Оформление заказа</h3>
                  <button onClick={() => setIsModalOpen(false)} className="absolute top-6 right-6 text-slate-500 hover:text-white"><Icon name="x" className="w-6 h-6" /></button>
                </div>

                {/* Scrollable Content */}
                <div className="overflow-y-auto p-6 space-y-6">
                  
                  {/* Cart Summary */}
                  <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-sm">
                    <h4 className="font-bold text-slate-400 mb-2 uppercase text-xs">Ваша корзина:</h4>
                    <ul className="space-y-1 text-slate-200">
                      {isPlayStation ? (
                        <>
                           <li className="flex justify-between font-bold text-white"><span>Платформа: PlayStation ({psConsole})</span></li>
                           {psCarMoney.id !== 'ps_m_none' && <li className="flex justify-between"><span>{psCarMoney.label}</span> <span>{psCarMoney.price}₽</span></li>}
                           {psCashMoney.id !== 'ps_c_none' && <li className="flex justify-between"><span>{psCashMoney.label}</span> <span>{psCashMoney.price}₽</span></li>}
                           {psLevel.id !== 'ps_l_none' && <li className="flex justify-between"><span>{psLevel.label}</span> <span>{psLevel.price}₽</span></li>}
                           {psReq200k && <li className="flex justify-between text-yellow-400"><span>Нет 200к (Комиссия)</span> <span>500₽</span></li>}
                           {psReqPlus && <li className="flex justify-between text-yellow-400"><span>Нет PS+ (Комиссия)</span> <span>500₽</span></li>}
                        </>
                      ) : (
                        <>
                          <li className="flex justify-between font-bold text-white"><span>Платформа: {PLATFORMS.find(p=>p.id===platform).label}</span></li>
                          {useMoney && <li className="flex justify-between"><span>Валюта: {PC_MONEY_PACKS[moneyIdx].label}</span> <span>{PC_MONEY_PACKS[moneyIdx].price}₽</span></li>}
                          {levelId && <li className="flex justify-between"><span>Уровень: {PC_LEVELS_MAIN.find(l=>l.id===levelId).label}</span> <span>{PC_LEVELS_MAIN.find(l=>l.id===levelId).price}₽</span></li>}
                          {[...PC_LEVELS_EXTRA, ...PC_UNLOCKS, ...PC_VEHICLES, ...PC_SPECIAL, ...PC_EXTRAS].filter(i => selectedExtras.has(i.id)).map(i => (
                            <li key={i.id} className="flex justify-between"><span>{i.label}</span> <span>{i.price}₽</span></li>
                          ))}
                        </>
                      )}
                    </ul>
                    <div className="mt-3 pt-3 border-t border-slate-700 flex justify-between font-bold text-lg text-white">
                      <span>Итого:</span>
                      <span className="accent-text">{totalPrice} RUB</span>
                    </div>
                  </div>

                  {/* Payment Methods */}
                  <div>
                    <h4 className="font-bold text-white mb-3">Выберите способ оплаты</h4>
                    <div className="space-y-2">
                       {REQUISITES.map((req, i) => (
                         <div key={i} className="flex items-center justify-between p-3 rounded-xl border border-slate-600 bg-slate-800">
                           <div className="flex items-center gap-3">
                             <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center accent-text">
                               <Icon name={req.icon} className="w-5 h-5" />
                             </div>
                             <div>
                               <div className="font-bold">{req.label}</div>
                               <div className="text-xs text-slate-400">Комиссия 0%</div>
                             </div>
                           </div>
                           <button onClick={() => navigator.clipboard.writeText(req.num.replace(/\s/g, ''))} className="text-xs bg-slate-700 hover:bg-white hover:text-black px-2 py-1 rounded transition">
                             {req.num} <Icon name="copy" className="w-3 h-3 inline ml-1" />
                           </button>
                         </div>
                       ))}
                    </div>
                    <p className="text-xs text-red-400 mt-2 text-center">⚠ Переведите <b>{totalPrice}₽</b> по реквизитам выше, затем заполните форму.</p>
                  </div>

                  {/* Form */}
                  <form id="payForm" onSubmit={handlePayment} className="space-y-4">
                      <div>
                        <label className="block text-xs text-slate-500 uppercase font-bold mb-1">Данные от аккаунта {isPlayStation ? '(PSN Email)' : '(Steam/Epic/Social)'}</label>
                        <div className="grid grid-cols-2 gap-2">
                          <input required placeholder={isPlayStation ? "PSN Email" : "Логин"} className="bg-slate-800 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-white/50 accent-border" value={login} onChange={e=>setLogin(e.target.value)} />
                          <input required type="password" placeholder="Пароль" className="bg-slate-800 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-white/50 accent-border" value={password} onChange={e=>setPassword(e.target.value)} />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs text-slate-500 uppercase font-bold mb-1">Куда писать о готовности?</label>
                        <input required placeholder="Ссылка на VK или Telegram" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-white/50 accent-border" value={contacts} onChange={e=>setContacts(e.target.value)} />
                      </div>
                  </form>
                </div>

                {/* Footer Actions */}
                <div className="p-6 border-t border-slate-800 bg-slate-900 z-10">
                   <button 
                     form="payForm"
                     disabled={isSubmitting}
                     className="w-full accent-bg hover:brightness-110 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition flex items-center justify-center gap-2"
                   >
                     {isSubmitting ? <Icon name="loader" className="animate-spin" /> : "Я ОПЛАТИЛ, ОТПРАВИТЬ"}
                   </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
